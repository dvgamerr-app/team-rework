name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@master

      - name: Setup node env 🏗
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          check-latest: true

      - name: Get bun run cache directory path 🛠
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(bun run cache dir)"

      - name: Cache node_modules 📦
        uses: actions/cache@v3.3.1
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies 👨🏻‍💻
        run: bun run - name: Run linter 👀
        run: bun run lint
